<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liftgate · ACP 网关工作台</title>
    <meta
      name="description"
      content="Liftgate 本地优先协议网关实时观测与审计工作台：OpenAI Responses / Anthropic Messages 双栈路由、Prompt 缓存命中率分析、低命中率记录持久化与 ACP 会话池监管。"
    />
    <meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141413'/%3E%3Crect x='11' y='11' width='10' height='10' rx='1.5' transform='rotate(45 16 16)' fill='%23D97757'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <style>
      html[data-theme-transition]::view-transition-group(root),
      html[data-theme-transition]::view-transition-old(root),
      html[data-theme-transition]::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      html[data-theme-transition="expand"]::view-transition-old(root),
      html[data-theme-transition="retract"]::view-transition-new(root) {
        z-index: 1;
      }

      html[data-theme-transition="expand"]::view-transition-new(root),
      html[data-theme-transition="retract"]::view-transition-old(root) {
        z-index: 9999;
      }

      html[data-theme-switching] *,
      html[data-theme-switching] *::before,
      html[data-theme-switching] *::after {
        transition: none !important;
      }
    </style>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (_) {}
        if (stored !== "dark" && stored !== "light") stored = null;
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var initialTheme = stored || (prefersDark ? "dark" : "light");
        var root = document.documentElement;
        root.setAttribute("data-theme", initialTheme);

        var desiredTheme = initialTheme;
        var inFlight = false;

        function commitPreference(next) {
          desiredTheme = next;
          try {
            localStorage.setItem("theme", next);
          } catch (_) {}
          try {
            window.dispatchEvent(
              new CustomEvent("sf-theme-change", { detail: { theme: next } }),
            );
          } catch (_) {}
        }

        function resolveOrigin(evt, el) {
          if (el && typeof el.getBoundingClientRect === "function") {
            var r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
          }
          if (evt && typeof evt.clientX === "number") {
            return { x: evt.clientX, y: evt.clientY };
          }
          return { x: window.innerWidth - 36, y: 26 };
        }

        window.__toggleTheme = function (evt, originEl) {
          var next = desiredTheme === "dark" ? "light" : "dark";
          commitPreference(next);

          var reduceMotion = !!(
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches
          );
          if (
            reduceMotion ||
            inFlight ||
            typeof document.startViewTransition !== "function"
          ) {
            root.setAttribute("data-theme-switching", "");
            root.setAttribute("data-theme", next);
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                root.removeAttribute("data-theme-switching");
              });
            });
            return;
          }

          var origin = resolveOrigin(evt, originEl);
          var cx = Math.round(origin.x);
          var cy = Math.round(origin.y);
          var endRadius = Math.ceil(
            Math.hypot(
              Math.max(cx, window.innerWidth - cx),
              Math.max(cy, window.innerHeight - cy),
            ),
          );
          var mode = next === "dark" ? "expand" : "retract";
          var pseudo =
            mode === "expand"
              ? "::view-transition-new(root)"
              : "::view-transition-old(root)";

          inFlight = true;
          root.setAttribute("data-theme-transition", mode);
          root.setAttribute("data-theme-switching", "");

          var transition = document.startViewTransition(function () {
            root.setAttribute("data-theme", desiredTheme);
          });

          transition.ready
            .then(function () {
              var fromClip =
                mode === "expand"
                  ? "circle(0px at " + cx + "px " + cy + "px)"
                  : "circle(" + endRadius + "px at " + cx + "px " + cy + "px)";
              var toClip =
                mode === "expand"
                  ? "circle(" + endRadius + "px at " + cx + "px " + cy + "px)"
                  : "circle(0px at " + cx + "px " + cy + "px)";
              root.animate(
                { clipPath: [fromClip, toClip] },
                {
                  duration: 420,
                  easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                  fill: "both",
                  pseudoElement: pseudo,
                },
              );
            })
            .catch(function () {});

          transition.finished.finally(function () {
            inFlight = false;
            root.removeAttribute("data-theme-transition");
            root.removeAttribute("data-theme-switching");
            if (root.getAttribute("data-theme") !== desiredTheme) {
              root.setAttribute("data-theme", desiredTheme);
            }
          });
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
