<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liftgate</title>
    <meta
      name="description"
      content="Liftgate gateway console: requests, cache hits, usage and cost, tool call I/O, tool catalogs, and the ACP session pool."
    />
    <meta name="theme-color" content="#f5f6f8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Cpath d='M9 23V12.5a7 7 0 0 1 14 0V23' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M12.5 17.5 16 14l3.5 3.5' fill='none' stroke='%236da7ec' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      html[data-theme-transition]::view-transition-group(root),
      html[data-theme-transition]::view-transition-old(root),
      html[data-theme-transition]::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      html[data-theme-transition="expand"]::view-transition-old(root),
      html[data-theme-transition="retract"]::view-transition-new(root) {
        z-index: 1;
      }

      html[data-theme-transition="expand"]::view-transition-new(root),
      html[data-theme-transition="retract"]::view-transition-old(root) {
        z-index: 9999;
      }

      html[data-theme-switching] *,
      html[data-theme-switching] *::before,
      html[data-theme-switching] *::after {
        transition: none !important;
      }
    </style>
    <script>
      (function () {
        // Language: a stored choice, else the system language (same rule as src/lib/i18n.tsx).
        try {
          var lang = localStorage.getItem("lg_locale");
          if (lang !== "zh" && lang !== "en") {
            var preferred = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
            lang = /^zh\b/i.test(preferred) ? "zh" : "en";
          }
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch (_) {}
      })();
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (_) {}
        if (stored !== "dark" && stored !== "light") stored = null;
        var systemDark = window.matchMedia
          ? window.matchMedia("(prefers-color-scheme: dark)")
          : null;
        var initialTheme = stored || (systemDark && systemDark.matches ? "dark" : "light");
        var root = document.documentElement;
        var chrome = document.querySelector('meta[name="theme-color"]');

        // Keep the mobile browser chrome the same colour as the canvas.
        function paintChrome(theme) {
          if (chrome) chrome.setAttribute("content", theme === "dark" ? "#0c0d0f" : "#f5f6f8");
        }

        root.setAttribute("data-theme", initialTheme);
        paintChrome(initialTheme);

        var desiredTheme = initialTheme;
        var explicit = stored !== null;
        var inFlight = false;

        function announce(next) {
          paintChrome(next);
          try {
            window.dispatchEvent(
              new CustomEvent("lg-theme-change", { detail: { theme: next } }),
            );
          } catch (_) {}
        }

        // Until the reader picks a theme, follow the system as it changes.
        if (systemDark && typeof systemDark.addEventListener === "function") {
          systemDark.addEventListener("change", function (ev) {
            if (explicit) return;
            desiredTheme = ev.matches ? "dark" : "light";
            root.setAttribute("data-theme", desiredTheme);
            announce(desiredTheme);
          });
        }

        function commitPreference(next) {
          desiredTheme = next;
          explicit = true;
          try {
            localStorage.setItem("theme", next);
          } catch (_) {}
          announce(next);
        }

        function resolveOrigin(evt, el) {
          if (el && typeof el.getBoundingClientRect === "function") {
            var r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
          }
          if (evt && typeof evt.clientX === "number") {
            return { x: evt.clientX, y: evt.clientY };
          }
          return { x: window.innerWidth - 36, y: 26 };
        }

        window.__toggleTheme = function (evt, originEl) {
          var next = desiredTheme === "dark" ? "light" : "dark";
          commitPreference(next);

          var reduceMotion = !!(
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches
          );
          if (
            reduceMotion ||
            inFlight ||
            typeof document.startViewTransition !== "function"
          ) {
            root.setAttribute("data-theme-switching", "");
            root.setAttribute("data-theme", next);
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                root.removeAttribute("data-theme-switching");
              });
            });
            return;
          }

          var origin = resolveOrigin(evt, originEl);
          var cx = Math.round(origin.x);
          var cy = Math.round(origin.y);
          var endRadius = Math.ceil(
            Math.hypot(
              Math.max(cx, window.innerWidth - cx),
              Math.max(cy, window.innerHeight - cy),
            ),
          );
          var mode = next === "dark" ? "expand" : "retract";
          var pseudo =
            mode === "expand"
              ? "::view-transition-new(root)"
              : "::view-transition-old(root)";

          inFlight = true;
          root.setAttribute("data-theme-transition", mode);
          root.setAttribute("data-theme-switching", "");

          var transition = document.startViewTransition(function () {
            root.setAttribute("data-theme", desiredTheme);
          });

          transition.ready
            .then(function () {
              var fromClip =
                mode === "expand"
                  ? "circle(0px at " + cx + "px " + cy + "px)"
                  : "circle(" + endRadius + "px at " + cx + "px " + cy + "px)";
              var toClip =
                mode === "expand"
                  ? "circle(" + endRadius + "px at " + cx + "px " + cy + "px)"
                  : "circle(0px at " + cx + "px " + cy + "px)";
              root.animate(
                { clipPath: [fromClip, toClip] },
                {
                  duration: 420,
                  easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                  fill: "both",
                  pseudoElement: pseudo,
                },
              );
            })
            .catch(function () {});

          transition.finished.finally(function () {
            inFlight = false;
            root.removeAttribute("data-theme-transition");
            root.removeAttribute("data-theme-switching");
            if (root.getAttribute("data-theme") !== desiredTheme) {
              root.setAttribute("data-theme", desiredTheme);
            }
          });
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
