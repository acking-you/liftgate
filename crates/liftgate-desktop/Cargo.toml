[package]
name = "liftgate-desktop"
description = "Standalone GPUI desktop control center for Liftgate (Antigravity ACP local API gateway, live telemetry, AI launchers, and environment manager)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "liftgate-desktop"
path = "src/main.rs"

[dependencies]
liftgate-core = { workspace = true }
liftgate-types = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
gpui-kit = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
