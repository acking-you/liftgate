[package]
name = "liftgate-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-support = ["liftgate-types/test-support", "liftgate-tool-virtualizer/test-support"]

[dependencies]
liftgate-provider-http = { workspace = true }
liftgate-provider-stateful = { workspace = true }
liftgate-tool-virtualizer = { workspace = true }
liftgate-types = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
dunce = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "fs", "signal"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
liftgate-types = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
