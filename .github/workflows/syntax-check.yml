name: Syntax Check

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit; checking everything."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"

          rust=false
          web=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|Cross.toml|rustfmt.toml|clippy.toml|*/Cargo.toml)
                rust=true
                ;;
              web/*)
                web=true
                ;;
              .github/workflows/syntax-check.yml)
                rust=true
                web=true
                ;;
            esac
          done <<< "$changed"

          echo "rust=$rust"
          echo "web=$web"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  rust-syntax-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-1.100.0-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.100.0-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # Process supervision (Win32 Job Objects vs macOS killpg) and system proxy
  # detection compile under OS-specific cfg gates, so lint and test them on
  # real Windows and macOS runners as well.
  rust-platform-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-platform-1.100.0-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-platform-1.100.0-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  web-syntax-check:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies and build web dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
