name: Build and release liftgate

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64 musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: Linux ARM64 musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x86_64 MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '
            /^\[workspace.package\]$/ { in_workspace = 1; next }
            in_workspace && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build companion web dashboard dist
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build liftgate CLI
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.platform.target }}
          toolchain: stable
          args: "--locked --release --bin liftgate"
          strip: true

      - name: Package artifact and publish tagged release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: liftgate
          target: ${{ matrix.platform.target }}
          archive-name: liftgate-${{ matrix.platform.target }}
          changes-file: CHANGELOG.md
          extra-files: |
            CHANGELOG.md
            LICENSE-MIT
            LICENSE-APACHE
            README.md
            AGENTS.md
            start-agy.ps1
            start-agy.cmd
            start-agy.sh
            web/dist
